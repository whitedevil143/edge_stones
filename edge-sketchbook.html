<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eef1e8">
<title>EDGE STONES — Interactive Project Sketchbook</title>
<meta name="description" content="Explore all 16 EDGE STONES stonework and landscaping project photographs in an interactive page-turning sketchbook.">
<link rel="canonical" href="https://edgestones.in/edge-sketchbook.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="EDGE STONES">
<meta property="og:title" content="EDGE STONES — Interactive Project Sketchbook">
<meta property="og:description" content="Explore EDGE STONES stonework and landscaping projects in an interactive photo sketchbook.">
<meta property="og:url" content="https://edgestones.in/edge-sketchbook.html">
<meta property="og:image" content="https://edgestones.in/images/edge-stones-landscaping-hero.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://edgestones.in/images/edge-stones-landscaping-hero.jpg">
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:Arial,sans-serif;color:#253d2d;background:radial-gradient(ellipse at 50% 35%,#fff 0%,#f2f4ed 45%,#e3e9dd 100%)}
.viewer{width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center;padding:22px 3vw 30px;position:relative;isolation:isolate}
.book-stage{width:min(96vw,1120px,calc((100svh - 70px)*1.52));position:relative;animation:float-book 7s ease-in-out infinite;filter:drop-shadow(0 26px 23px rgba(38,54,35,.2))}
.book-stage:before{content:"";position:absolute;z-index:-1;left:8%;right:8%;bottom:-7%;height:12%;border-radius:50%;background:rgba(46,62,42,.22);filter:blur(20px);animation:shadow 7s ease-in-out infinite}
.book{position:relative;width:100%;aspect-ratio:1.52;background:#f8f6ef;border:1px solid #d6d2c5;border-radius:5px;overflow:hidden;transform:perspective(1800px) rotateX(5deg) rotateY(-3deg);transform-style:preserve-3d;box-shadow:0 3px 0 #d4cfbf,0 7px 0 #e5e0d3,0 10px 2px #7775,0 22px 36px -22px #263a2b66}
.book:after{content:"";position:absolute;inset:0;pointer-events:none;border:1px solid #fff9;box-shadow:inset 0 0 24px #263a2b12}
.page-image{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#f8f6ef;display:block}
.sheet{position:absolute;inset:0;z-index:3;transform-style:preserve-3d;transform-origin:left center;display:none}
.sheet.active{display:block}
.sheet.turn-next{animation:turn-next .72s cubic-bezier(.2,.72,.25,1) forwards}
.sheet.turn-prev{transform-origin:right center;animation:turn-prev .72s cubic-bezier(.2,.72,.25,1) forwards}
.face{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#f8f6ef;backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.spine{position:absolute;z-index:4;top:0;bottom:0;left:50%;width:1px;background:linear-gradient(90deg,#9a927d66,#fff9,#8f8a7866);pointer-events:none}
.controls{position:absolute;left:0;right:0;bottom:5px;display:flex;justify-content:center;align-items:center;gap:12px;z-index:5}
.control{width:38px;height:38px;border:1px solid #c9cfbf;border-radius:50%;background:#ffffffdf;color:#274632;font-size:21px;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px #233b2915;transition:transform .2s,background .2s}
.control:hover{background:#e4eadf;transform:translateY(-2px)}
.control:disabled{opacity:.35;cursor:not-allowed;transform:none}
.counter{min-width:74px;text-align:center;color:#53654e;font-size:11px;letter-spacing:.12em;font-weight:700}
.caption{position:absolute;top:calc(100% + 18px);left:0;right:0;text-align:center;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#75816d}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:#66745f;font-size:12px;letter-spacing:.12em}
@keyframes turn-next{0%{transform:rotateY(0)}100%{transform:rotateY(-180deg)}}
@keyframes turn-prev{0%{transform:rotateY(0)}100%{transform:rotateY(180deg)}}
@keyframes float-book{0%,100%{transform:translateY(-10px) rotateZ(-.5deg)}50%{transform:translateY(-27px) rotateZ(.45deg)}}
@keyframes shadow{0%,100%{opacity:.8;transform:scaleX(.94)}50%{opacity:.45;transform:scaleX(1.04)}}
@media(max-width:640px){.viewer{padding:18px 2vw 44px}.book-stage{width:min(98vw,calc((100svh - 94px)*1.12))}.book{transform:perspective(1200px) rotateX(3deg) rotateY(-1.5deg)}.controls{bottom:-39px}.control{width:34px;height:34px}.caption{top:calc(100% + 51px);font-size:8px}}
@media(prefers-reduced-motion:reduce){.book-stage,.book-stage:before{animation:none}.sheet.turn-next,.sheet.turn-prev{animation-duration:.01ms}}
</style>
</head>
<body>
<main class="viewer" aria-label="EDGE STONES interactive project sketchbook">
<div class="book-stage">
<div class="book" id="book" aria-live="polite">
<div class="loading" id="loading">LOADING PROJECT SKETCHBOOK…</div>
<img class="page-image" id="currentPage" alt="EDGE STONES project photograph" fetchpriority="high" decoding="async">
<div class="sheet" id="sheet" aria-hidden="true"><img class="face front" id="frontPage" alt=""><img class="face back" id="backPage" alt=""></div>
<div class="spine" aria-hidden="true"></div>
</div>
<div class="controls">
<button class="control" id="previous" type="button" aria-label="Previous page">‹</button>
<span class="counter" id="counter">01 / 16</span>
<button class="control" id="next" type="button" aria-label="Next page">›</button>
</div>
<div class="caption" id="caption">EDGE STONES · PROJECT COLLECTION</div>
</div>
</main>
<script>
"use strict";
const PAGES=[{"url":"images/sketchbook/IMG-20261102-WA0027.jpg","title":"EDGE STONES · Project 01"},{"url":"images/sketchbook/IMG-20261102-WA0028.jpg","title":"EDGE STONES · Project 02"},{"url":"images/sketchbook/IMG-20261102-WA0032.jpg","title":"EDGE STONES · Project 03"},{"url":"images/sketchbook/IMG-20261102-WA0034.jpg","title":"EDGE STONES · Project 04"},{"url":"images/sketchbook/IMG-20261102-WA0035.jpg","title":"EDGE STONES · Project 05"},{"url":"images/sketchbook/IMG-20261102-WA0036.jpg","title":"EDGE STONES · Project 06"},{"url":"images/sketchbook/IMG-20261102-WA0037.jpg","title":"EDGE STONES · Project 07"},{"url":"images/sketchbook/IMG-20261102-WA0046.jpg","title":"EDGE STONES · Project 08"},{"url":"images/sketchbook/IMG-20261102-WA0047.jpg","title":"EDGE STONES · Project 09"},{"url":"images/sketchbook/IMG-20261102-WA0050.jpg","title":"EDGE STONES · Project 10"},{"url":"images/sketchbook/IMG-20261102-WA0057.jpg","title":"EDGE STONES · Project 11"},{"url":"images/sketchbook/IMG-20261102-WA0058.jpg","title":"EDGE STONES · Project 12"},{"url":"images/sketchbook/IMG-20261102-WA0061.jpg","title":"EDGE STONES · Project 13"},{"url":"images/sketchbook/IMG-20261102-WA0062.jpg","title":"EDGE STONES · Project 14"},{"url":"images/sketchbook/IMG-20261102-WA0065.jpg","title":"EDGE STONES · Project 15"},{"url":"images/sketchbook/IMG-20261102-WA0068.jpg","title":"EDGE STONES · Project 16"}];
const current=document.getElementById("currentPage");
const sheet=document.getElementById("sheet");
const front=document.getElementById("frontPage");
const back=document.getElementById("backPage");
const counter=document.getElementById("counter");
const caption=document.getElementById("caption");
const previous=document.getElementById("previous");
const next=document.getElementById("next");
const loading=document.getElementById("loading");
let index=0,locked=false;
function preload(i){if(i<0||i>=PAGES.length)return;const img=new Image();img.src=PAGES[i].url;}
function render(){const page=PAGES[index];current.src=page.url;current.alt=page.title;counter.textContent=String(index+1).padStart(2,"0")+" / "+String(PAGES.length).padStart(2,"0");caption.textContent="EDGE STONES · PROJECT COLLECTION";previous.disabled=index===0;next.disabled=index===PAGES.length-1;preload(index+1);preload(index-1);}
function turn(direction){
 if(locked)return;
 const target=index+direction;
 if(target<0||target>=PAGES.length)return;
 locked=true;
 const nextImage=new Image();
 nextImage.onload=()=>{
  front.src=PAGES[index].url;
  front.alt=PAGES[index].title;
  back.src=PAGES[target].url;
  back.alt=PAGES[target].title;
  sheet.className="sheet";
  void sheet.offsetWidth;
  sheet.classList.add("active",direction>0?"turn-next":"turn-prev");
  sheet.setAttribute("aria-hidden","false");
  const finish=()=>{
   sheet.removeEventListener("animationend",finish);
   index=target;
   sheet.className="sheet";
   sheet.setAttribute("aria-hidden","true");
   render();
   locked=false;
  };
  sheet.addEventListener("animationend",finish,{once:true});
 };
 nextImage.onerror=()=>{locked=false;};
 nextImage.src=PAGES[target].url;
}
current.addEventListener("load",()=>loading.hidden=true,{once:true});
current.addEventListener("error",()=>{loading.hidden=false;loading.textContent="A PROJECT PHOTO COULD NOT BE LOADED";});
previous.addEventListener("click",()=>turn(-1));
next.addEventListener("click",()=>turn(1));
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")turn(-1);if(e.key==="ArrowRight")turn(1);});
let startX=0;
document.getElementById("book").addEventListener("touchstart",e=>{startX=e.changedTouches[0].clientX;},{passive:true});
document.getElementById("book").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>35)turn(dx<0?1:-1);},{passive:true});
render();
</script>
</body>
</html>
